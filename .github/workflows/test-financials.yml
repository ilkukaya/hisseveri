name: Update Selected Stocks

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Hisse kodları (boş bırakırsan 10 test hissesi çalışır)'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and save financial data
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python scripts/update_selected.py ${{ github.event.inputs.tickers }}
          else
            python scripts/update_selected.py
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          git diff --staged --quiet || git commit -m "chore: update financial data for selected stocks"
          git push
