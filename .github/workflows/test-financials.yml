name: Test Financial Data Fetch

on:
  workflow_dispatch: {}  # Manuel tetikleme

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run financial data test (10 stocks)
        run: python scripts/test_financials.py
        env:
          DEBUG_FINANCIALS: "FROTO"
