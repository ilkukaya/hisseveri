name: Update Financial Data

on:
  # Mali tablo yayın dönemlerinde haftada bir çalışır (Pazar 18:00 UTC / 21:00 İstanbul)
  # Q1 sonuçları: Nisan-Mayıs, Q2: Temmuz-Ağustos, Q3: Ekim-Kasım, Q4: Şubat-Mart
  schedule:
    - cron: '0 18 * 2-5,7-8,10-11 0'  # Bildirim aylarında haftada bir (Pazar)
  workflow_dispatch: {}  # Manuel tetikleme (yeni bilanço yayınlandığında)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # 613 hisse için yeterli süre
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch all BIST stock data
        run: python scripts/build_all_data.py
        env:
          DEBUG_FINANCIALS: "1"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          git diff --staged --quiet || git commit -m "chore: update financial data $(date +%Y-%m-%d)"
          git push
